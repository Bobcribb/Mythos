name: Publier MYTHOS sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Générer les lectures intégrales de Daidalos et vérifier leur source
        run: python3 scripts/build-daidalos.py
      - name: Intégrer Polyidos, ses lectures intégrales et les liens réciproques
        run: python3 scripts/build-polyidos.py
      - name: Vérifier les pages essentielles
        run: |
          test -s index.html
          test -s mythologie-grecque.html
          test -s corpus/mythologie-grecque/archives/livre-dieux.html
          test -s corpus/mythologie-grecque/archives/livre-thebes.html
          test -s assets/mythos-volume-lecture.css
          test -s corpus/origines-du-sacre/conv-tome-XXXII-chapitres-395-402.html
          test -s corpus/origines-du-sacre/conv-tome-XXXII-chapitres-395-402.md
          test -s corpus/origines-du-sacre/conv-tome-XXXIII-chapitres-403-410.html
          test -s corpus/origines-du-sacre/conv-tome-XXXIII-chapitres-403-410.md
          test "$(wc -c < corpus/origines-du-sacre/conv-tome-XXXII-chapitres-395-402.md)" -gt 50000
          test "$(wc -c < corpus/origines-du-sacre/conv-tome-XXXIII-chapitres-403-410.md)" -gt 50000
          grep -q 'id="chapitre-395"' corpus/origines-du-sacre/conv-tome-XXXII-chapitres-395-402.html
          grep -q 'id="chapitre-402"' corpus/origines-du-sacre/conv-tome-XXXII-chapitres-395-402.html
          grep -q 'id="chapitre-403"' corpus/origines-du-sacre/conv-tome-XXXIII-chapitres-403-410.html
          grep -q 'id="chapitre-410"' corpus/origines-du-sacre/conv-tome-XXXIII-chapitres-403-410.html
          grep -q 'id="bibliographie"' corpus/origines-du-sacre/conv-tome-XXXII-chapitres-395-402.html
          grep -q 'id="bibliographie"' corpus/origines-du-sacre/conv-tome-XXXIII-chapitres-403-410.html
          grep -q 'conv-tome-XXXIII-chapitres-403-410.html' origines-du-sacre.html
          test -s corpus/theatre-grec/comedies/daidalos-etude.html
          test -s corpus/theatre-grec/comedies/daidalos-scenes-modernes.html
          test -s corpus/theatre-grec/comedies/daidalos-controle.json
          test -s corpus/theatre-grec/comedies/polyidos-etude.html
          test -s corpus/theatre-grec/comedies/polyidos-scenes-modernes.html
          test -s corpus/theatre-grec/comedies/polyidos-controle.json
          grep -q 'id="bibliographie"' corpus/theatre-grec/comedies/polyidos-etude.html
          grep -q 'polyidos-etude.html' theatre-grec.html
          grep -q 'polyidos-etude.html' philosophie.html
          grep -q 'polyidos-etude.html' sommaire-general.html
          grep -q 'polyidos-etude.html' corpus/theatre-grec/comedies/daidalos-etude.html
          echo "Pages MYTHOS présentes dans l'artefact"
      - name: Préparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
