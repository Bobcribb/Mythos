name: Publier MYTHOS sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Vérifier les pages essentielles
        run: |
          test -s index.html
          test -s mythologie-grecque.html
          test -s corpus/mythologie-grecque/archives/livre-dieux.html
          test -s corpus/mythologie-grecque/archives/livre-thebes.html
          echo "Pages MYTHOS présentes dans l'artefact"
      - name: Préparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
