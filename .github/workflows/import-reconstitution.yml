name: MYTHOS - Importer une reconstitution photorealiste
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "URL HTTPS directe d'une image PNG, JPEG ou WebP"
        required: true
        type: string
      site_name:
        description: "Titre du site ou monument"
        required: true
        type: string
      site_slug:
        description: "Identifiant unique en minuscules et tirets"
        required: true
        type: string
      source_url:
        description: "Lien HTTPS vers la source institutionnelle (UNESCO, ministère, institut archéologique)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: mythos-images
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - name: Importer et convertir en WebP
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          SITE_NAME: ${{ inputs.site_name }}
          SITE_SLUG: ${{ inputs.site_slug }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: python scripts/import_reconstitution.py
      - name: Publier les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reconstitutions-3d/ reconstitutions-photorealistes.html
          if ! git diff --cached --quiet; then
            git commit -m "MYTHOS: publier une reconstitution photorealiste"
            git push
          fi
