name: MYTHOS - Génération photoréaliste horaire
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mythos-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::Configurer OPENAI_API_KEY dans les secrets du dépôt avant toute génération."
            exit 0
          fi
      - name: Générer une reconstitution
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_reconstitution.py
      - name: Publier
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reconstitutions-3d/photorealistes.json assets/reconstitutions-3d/*.webp reconstitutions-photorealistes.html
          if ! git diff --cached --quiet; then
            git commit -m "MYTHOS: nouvelle reconstitution photoréaliste"
            git pull --rebase
            git push
          fi
