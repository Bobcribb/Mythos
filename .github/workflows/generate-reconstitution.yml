name: MYTHOS - Génération photoréaliste horaire
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mythos-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Actualiser le manifeste depuis main
        run: git pull --ff-only origin main
      - name: Vérifier la configuration API
        id: config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configurer OPENAI_API_KEY dans les secrets du dépôt avant toute génération."
          fi
      - name: Générer une reconstitution
        if: ${{ steps.config.outputs.enabled == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_reconstitution.py
      - name: Publier
        if: ${{ steps.config.outputs.enabled == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reconstitutions-3d/photorealistes.json assets/reconstitutions-3d/*.webp reconstitutions-photorealistes.html reconstitutions-3d.html
          if ! git diff --cached --quiet; then
            git commit -m "MYTHOS: nouvelle reconstitution photoréaliste"
            git pull --rebase
            git push
          fi
