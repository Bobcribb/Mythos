function categorize(p){let slug=(p.slug||'').toLowerCase();let title=normalize(p.title||'');let theatre=/traged|sophocle|euripide|eschyle|aristophane|comedie|menandre|theatre|myrmidon|phaethon|teree|laocoon|hypsipyle|antiope|promethee|polyxene|oedipe-aveuglement/i.test(slug+' '+title);if(theatre)return'theatre';if(/dieu-|heros-|monographies|heracles|hecate|osiris|cybele|mithra|melqart/i.test(slug))return'dieux';if(/sanctuaire|delphes|delos|olympie|dodone|nemee|epidaure|isthmia|brauron|persepolis|behistun|atlas|artemision|yazilikaya|amphiaraion/i.test(slug))return'atlas';if(/bibliotheque-(egypte|mesopotamie|perse|rome)|mythologies-du-monde|portail-unifie/i.test(slug))return'civilisations';if(/akhetaton|dossier|horizon-aton/i.test(slug))return'dossiers';if(/iliade|odyssee|gilgamesh|enuma|atrahasis|inanna|hesiode|baal|texts|texte|gathas|hymne|argonaut|kumarbi/i.test(slug))return'recits';return'bibliotheque'}
async function loadArticle(item){try{const urls=['https://public-api.wordpress.com/wp/v2/sites/258246812/pages/'+item.id+'?_fields=id,content','https://bobmythos.wordpress.com/wp-json/wp/v2/pages/'+item.id+'?_fields=id,content'];for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;const d=await r.json();if(d.content?.rendered){item.content=d.content.rendered;if(state.reader?.slug===item.slug){state.reader=item;render()}break}}catch(e){}}}catch(e){}}
async function sync(){const endpoints=['https://public-api.wordpress.com/wp/v2/sites/258246812/pages?per_page=100&page=','https://bobmythos.wordpress.com/wp-json/wp/v2/pages?per_page=100&page='];for(const base of endpoints){try{let controller=new AbortController(),tm=setTimeout(()=>controller.abort(),6500);const first=await fetch(base+'1&_fields=id,slug,title,excerpt,link,parent',{signal:controller.signal});clearTimeout(tm);if(!first.ok)throw Error('API');let a=await first.json();if(!Array.isArray(a)||!a.length)throw Error('empty');let pages=[...a];const pagesToFetch=Math.min(5,Math.max(1,Number(first.headers.get('X-WP-TotalPages'))||3));let further=await Promise.all(Array.from({length:pagesToFetch-1},(_,i)=>fetch(base+(i+2)+'&_fields=id,slug,title,excerpt,link,parent').then(r=>r.ok?r.json():[]).catch(()=>[])));further.forEach(x=>{if(Array.isArray(x))pages.push(...x)});let out=pages.map(p=>({uid:'wp'+p.id,id:p.id,title:dehtml(p.title?.rendered||p.title||''),slug:p.slug,url:p.link||BASE+'/'+p.slug+'/',cat:categorize({slug:p.slug,title:p.title?.rendered||''}),content:p.content?.rendered||''}));state.apiItems=out;state.apiOk=pages.length>120;state.loading=false;render();return}catch(e){}}state.loading=false}
$('.mobile-menu').onclick=()=>{$('.side').classList.add('open');$('.sidelayer').classList.add('show')};$('.sidelayer').onclick=()=>{$('.side').classList.remove('open');$('.sidelayer').classList.remove('show')};$('#find').addEventListener('input',e=>{state.query=e.target.value;const section=state.section;if(section!=='bibliotheque')go('bibliotheque');else{let library=$('.librarylist')?.parentElement;if(library?.update)library.update();else render()}});window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/article/'))state.reader=resolve(decodeURIComponent(location.hash.split('/')[2]||''));render()});render();sync();
</script></body></html>
