<title id="t">DOD-002 — Dodone : Hiéra Oikia et chêne oraculaire</title><desc id="d">Vue perspective 2,5D interprétative du petit temple de Zeus et de l'enceinte à portiques ioniques sur trois côtés au début du IIIe siècle av. J.-C. La place du chêne, ses dimensions, les façades et la couleur sont schématiques. Aucun menu du site.</desc>
