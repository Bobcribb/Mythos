<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="t d"><title id="t">Écrire l’histoire des civilisations</title><desc id="d">La confrontation des témoignages est nécessaire pour chaque dossier : INSCRIPTIONS, Paroles de souverains, Lois, dédicaces et archives, Documents souvent situés, dans un projet politique; ARCHÉOLOGIE, Objets, monuments et sols, Stratigraphie et datation, Observer les contextes, et leurs transformations; RÉCITS, Historiens et traditions, Mémoires conflictuelles, Comparer les versions, sans isoler un témoignage</desc><rect width="1200" height="550" fill="#0d1315"/><rect x="18" y="18" width="1164" height="514" rx="12" stroke="#685338" stroke-width="1" fill="none"/><text x="600" y="67" font-size="36" text-anchor="middle" font-family="Georgia,serif" fill="#f1d7a8">Écrire l’histoire des civilisations</text><text x="600" y="110" font-size="18" text-anchor="middle" font-family="Arial,sans-serif" fill="#d5c7b0">La confrontation des témoignages est nécessaire pour chaque dossier</text><rect x="50" y="158" width="340" height="237" rx="12" fill="#1f292b" stroke="#b99b6a" stroke-width="2"/><text x="220" y="215" text-anchor="middle" font-size="28" font-family="Georgia,serif" fill="#f2d5a3">INSCRIPTIONS</text><path d="M88 236h264" stroke="#6d5e46"/>
