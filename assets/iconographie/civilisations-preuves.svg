<text x="980" y="368" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">sans isoler un témoignage</text><text x="600" y="461" font-size="23" text-anchor="middle" font-family="Georgia,serif" fill="#f2dbba">À Behistun, relief et écriture construisent aussi un récit de légitimité</text><text x="600" y="508" font-size="15" text-anchor="middle" font-family="Arial,sans-serif" fill="#bfb1a0">MYTHOS · 3 novembre 2026 · schéma actuel assisté par IA · UNESCO, Bisotun</text></svg>