<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="titre desc"><title id="titre">Les cinq générations humaines dans les Travaux et les Jours</title><desc id="desc">Succession littéraire chez Hésiode : or, argent, bronze, héros, fer. Les héros sont une interruption de la dégradation, et non une période archéologique.</desc><rect width="1280" height="590" fill="#111719"/><text x="640" y="63" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#f0d5a5">Hésiode : les cinq générations humaines</text><text x="640" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#e9e0d2">Les Travaux et les Jours, vers 106–201</text><rect x="33" y="159" width="220" height="280" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="143" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f0d5a5">OR</text><text x="143" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Sans peine</text><text x="143" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">ni vieillissement</text><text x="143" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">(v. 109–126)</text><text x="143" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b7ad9d">1 / 5</text><rect x="282" y="159" width="220" height="280" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="392" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f0d5a5">ARGENT</text><text x="392" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Longue enfance,</text><text x="392" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">défaut d'hommage</text><text x="392" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">(v. 127–142)</text><text x="392" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b7ad9d">2 / 5</text><rect x="531" y="159" width="220" height="280" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="641" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f0d5a5">BRONZE</text><text x="641" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Force guerrière,</text><text x="641" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">autodestruction</text><text x="641" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">(v. 143–155)</text><text x="641" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b7ad9d">3 / 5</text><rect x="780" y="140" width="220" height="299" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="890" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f0d5a5">HÉROS</text><text x="890" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Thèbes et Troie :</text><text x="890" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">une exception</text><text x="890" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">(v. 156–173)</text><text x="890" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b7ad9d">4 / 5</text><rect x="1029" y="159" width="220" height="280" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="1139" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f0d5a5">FER</text><text x="1139" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Labeur, conflit,</text><text x="1139" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">injustice</text><text x="1139" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">(v. 174–201)</text><text x="1139" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b7ad9d">5 / 5</text><text x="640" y="488" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f2ddbb">Les héros interrompent la dégradation : ce n'est pas une chronologie archéologique.</text><text x="640" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c8bcad">« Générations » (genê) : catégories narratives du poème, non groupes biologiques.</text><text x="640" y="572" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bcb1a3">MYTHOS · 3 novembre 2026 · schéma contemporain avec assistance IA · non historique</text></svg>