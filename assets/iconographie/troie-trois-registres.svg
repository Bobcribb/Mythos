<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">Troie : trois régimes de preuves distincts</title><desc id="svgdesc">Trois cadres : épopées et récits anciens, témoignages fragmentaires du cycle épique, stratigraphie du site archéologique de Troie. Leur rapprochement ne confirme pas les événements de l'Iliade.</desc><rect width="1200" height="600" fill="#101618"/><rect x="17" y="17" width="1166" height="566" rx="12" fill="none" stroke="#665439" stroke-width="2"/>
<text x="600" y="70" fill="#f1d4a4" text-anchor="middle" font-family="Georgia,serif" font-size="39">Troie : récit, tradition, archéologie</text>
<text x="600" y="111" fill="#d8caba" text-anchor="middle" font-family="Arial,sans-serif" font-size="20">Trois ensembles de sources à confronter sans les confondre</text>
<g fill="#1d282a" stroke="#b69a71" stroke-width="3"><rect x="43" y="163" width="353" height="290" rx="13"/><rect x="423" y="163" width="353" height="290" rx="13"/><rect x="803" y="163" width="353" height="290" rx="13"/></g>
<g font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#f4d8a6"><text x="219" y="216">L’ÉPOPÉE</text><text x="599" y="216">LE CYCLE</text><text x="979" y="216">LE SITE</text></g>
<g font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#ede0ce"><text x="219" y="270">Iliade d’Homère</text><text x="219" y="309">Colère d’Achille</text><text x="219" y="346">Événements littéraires</text><text x="219" y="384">et horizon héroïque</text>
<text x="599" y="270">Épopées largement perdues</text><text x="599" y="309">Résumés et fragments</text><text x="599" y="346">Débuts, chute, retours</text><text x="599" y="384">Traditions divergentes</text>
<text x="979" y="270">Hisarlık (Anatolie)</text><text x="979" y="309">Strates d’occupation</text><text x="979" y="346">Objets, destructions, datations</text><text x="979" y="384">Interprétations débattues</text></g>
<text x="600" y="492" text-anchor="middle" font-family="Georgia,serif" fill="#f1d4a4" font-size="26">Des vestiges attestent un site, pas la lettre du poème.</text>
<text x="600" y="535" text-anchor="middle" font-family="Arial,sans-serif" fill="#cebfac" font-size="17">Homère, Iliade · fragments du Cycle épique · UNESCO, site archéologique de Troie</text>
<text x="600" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#c1b7a7">Analyse de sources, non reconstruction du siège · MYTHOS, 3 novembre 2026 · schéma contemporain assisté par IA</text></svg>