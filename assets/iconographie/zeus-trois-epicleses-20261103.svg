<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Zeus : un dieu, plusieurs épiclèses</title><desc id="desc">Les qualifications cultuelles dépendent des contextes. ZEUS XENIOS: Hospitalité et protection de l’étranger Odyssée IX, 270–271; ZEUS HORKIOS: Garant des serments dans le contexte olympique Pausanias V, 24, 9; ZEUS POLIEUS: Culte civique athénien sur l’Acropole Pausanias I, 24, 4.</desc><rect width="1200" height="600" fill="#0c1215"/><path d="M42 126H1158" stroke="#6d573b" stroke-width="2"/><text x="600" y="63" text-anchor="middle" fill="#f0d3a2" font-family="Georgia,serif" font-size="37">Zeus : un dieu, plusieurs épiclèses</text><text x="600" y="104" text-anchor="middle" fill="#d5c5b1" font-family="Arial,sans-serif" font-size="20">Les qualifications cultuelles dépendent des contextes</text><rect x="42" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="208" cy="204" r="22" fill="#ab8c5d"/><text x="208" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">1</text><text x="208" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">ZEUS XENIOS</text><text x="208" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Hospitalité et protection</text><text x="208" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">de l’étranger</text><text x="208" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Odyssée IX, 270–271</text><rect x="429" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="595" cy="204" r="22" fill="#ab8c5d"/><text x="595" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">2</text><text x="595" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">ZEUS HORKIOS</text><text x="595" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Garant des serments</text><text x="595" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">dans le contexte olympique</text><text x="595" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Pausanias V, 24, 9</text><rect x="816" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="982" cy="204" r="22" fill="#ab8c5d"/><text x="982" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">3</text><text x="982" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">ZEUS POLIEUS</text><text x="982" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Culte civique athénien</text><text x="982" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">sur l’Acropole</text><text x="982" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Pausanias I, 24, 4</text><text x="600" y="484" text-anchor="middle" fill="#edd5af" font-family="Georgia,serif" font-size="23">Trois épiclèses ne constituent pas trois divinités distinctes</text><text x="600" y="533" text-anchor="middle" fill="#d0c0aa" font-family="Arial,sans-serif" font-size="17">Sources antiques : Homère, Odyssée ; Pausanias, Description de la Grèce</text><text x="600" y="574" text-anchor="middle" fill="#aa9a85" font-family="Arial,sans-serif" font-size="15">MYTHOS · 3 novembre 2026 · création numérique contemporaine assistée par IA · non historique</text></svg>