<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Trois approches de la comparaison des mythes</title><desc id="desc">Schéma de méthode comparant les structures narratives, les transmissions documentées et les contextes locaux, avec rappel que la similitude ne prouve pas une origine commune.</desc><rect width="1200" height="590" fill="#0d1416"/><text x="600" y="63" text-anchor="middle" fill="#f0d3a2" font-family="Georgia,serif" font-size="39">Comparer les mythes : trois niveaux d’analyse</text><text x="600" y="103" text-anchor="middle" fill="#d7c8b4" font-family="Arial,sans-serif" font-size="20">Méthode historique et philosophique</text><g fill="#1d282a" stroke="#b99a68" stroke-width="3"><rect x="45" y="157" width="345" height="255" rx="13"/><rect x="428" y="157" width="345" height="255" rx="13"/><rect x="811" y="157" width="345" height="255" rx="13"/></g><g text-anchor="middle" fill="#f0d3a2" font-family="Georgia,serif" font-size="27"><text x="217" y="217">ANALOGIES</text><text x="600" y="217">TRANSMISSIONS</text><text x="983" y="217">CONTEXTES</text></g><g text-anchor="middle" fill="#e8dfd0" font-family="Arial,sans-serif" font-size="20"><text x="217" y="275">Motifs et fonctions</text><text x="217" y="311">comparables</text><text x="217" y="355">≠ filiation démontrée</text><text x="600" y="275">Contacts, textes,</text><text x="600" y="311">chronologies et relais</text><text x="600" y="355">preuves à documenter</text><text x="983" y="275">Langues, institutions,</text><text x="983" y="311">rites et variantes</text><text x="983" y="355">sens situés</text></g><text x="600" y="470" text-anchor="middle" fill="#f0d3a2" font-family="Georgia,serif" font-size="26">Une ressemblance ouvre une enquête ; elle ne la conclut pas.</text><text x="600" y="521" text-anchor="middle" fill="#c9bda9" font-family="Arial,sans-serif" font-size="17">Repères : comparaison structurale, critique des sources, histoire des contacts</text><text x="600" y="559" text-anchor="middle" fill="#b7aa97" font-family="Arial,sans-serif" font-size="16">MYTHOS · schéma original, 2026 · non historique · création vectorielle sans IA générative</text></svg>