<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Aphrodite : des généalogies différentes</title><desc id="desc">Deux traditions poétiques anciennes, sans harmonisation forcée. HÉSIODE: Théogonie, v. 188–206 Naissance dans l’écume après la mutilation d’Ouranos. HOMÈRE: Iliade V, v. 370–430 Aphrodite est fille de Zeus et de Dioné dans le récit épique. PRUDENCE: Deux traditions attestées Contextes poétiques distincts Ne pas convertir l’une en correction de l’autre</desc><rect width="1200" height="550" fill="#0d1315"/><rect x="18" y="18" width="1164" height="514" rx="12" fill="none" stroke="#6c5537" stroke-width="1"/><text x="600" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#f1d7a8">Aphrodite : des généalogies différentes</text><text x="600" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d5c7b0">Deux traditions poétiques anciennes, sans harmonisation forcée</text><g><rect x="50" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="220" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">HÉSIODE</text><line x1="80" y1="235" x2="360" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="220" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Théogonie, v. 188–206</text><text x="220" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Naissance dans l’écume</text><text x="220" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">après la mutilation</text><text x="220" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">d’Ouranos</text></g><g><rect x="430" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="600" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">HOMÈRE</text><line x1="460" y1="235" x2="740" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="600" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Iliade V, v. 370–430</text><text x="600" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Aphrodite est fille</text><text x="600" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">de Zeus et de Dioné</text><text x="600" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">dans le récit épique</text></g><g><rect x="810" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="980" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">PRUDENCE</text><line x1="840" y1="235" x2="1120" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="980" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Deux traditions attestées</text><text x="980" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Contextes poétiques distincts</text><text x="980" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Ne pas convertir l’une</text><text x="980" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">en correction de l’autre</text></g><text x="600" y="459" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#f1dcba">Variante textuelle attestée ≠ erreur de transmission</text><text x="600" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bcb0a0">MYTHOS · 3 novembre 2026 · schéma contemporain (assistance IA) · non antique</text></svg>