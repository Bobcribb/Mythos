<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="titre desc"><title id="titre">Médiations du divin : trois dossiers documentaires distincts</title><desc id="desc">Comparaison prudente de la représentation dramatique de Dionysos dans les Bacchantes, des lettres prophétiques de Mari et des processions cultuelles égyptiennes : des sources de statuts différents.</desc><rect width="1200" height="595" fill="#111719"/><text x="600" y="61" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#f0d5a5">Corps, parole et présence divine</text><text x="600" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e9e0d2">Comparer les sources sans unifier artificiellement les pratiques</text><rect x="45" y="157" width="346" height="255" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="218" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#f0d5a5">GRÈCE : DIONYSOS</text><text x="218" y="264" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#e1ca9c">Texte dramatique</text><text x="218" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">Euripide, Bacchantes :</text><text x="218" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">une représentation</text><text x="218" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">poétique de l'inspiration</text><rect x="427" y="157" width="346" height="255" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="600" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#f0d5a5">MARI : ORACLES</text><text x="600" y="264" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#e1ca9c">Lettres palatiales</text><text x="600" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">ARM XXVI : paroles</text><text x="600" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">transmises, copiées</text><text x="600" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">et adressées au roi</text><rect x="809" y="157" width="346" height="255" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="982" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#f0d5a5">ÉGYPTE : FÊTES</text><text x="982" y="264" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#e1ca9c">Sources cultuelles</text><text x="982" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">Textes et images :</text><text x="982" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">rites, processions,</text><text x="982" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e9e0d2">présence divine figurée</text><text x="600" y="470" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#f2ddbb">Une source donne accès à un dispositif ; elle ne prouve pas une « transe » universelle.</text><text x="600" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c9beaf">Bacchantes · ARM XXVI · iconographie religieuse égyptienne</text><text x="600" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bcb1a3">MYTHOS · 3 novembre 2026 · schéma contemporain avec assistance IA · non historique</text></svg>