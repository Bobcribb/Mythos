<text x="220" y="368" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">selon leur certitude</text>
<rect x="430" y="158" width="340" height="237" rx="12" fill="#1f292b" stroke="#b99b6a" stroke-width="2"/><text x="600" y="215" text-anchor="middle" font-size="28" font-family="Georgia,serif" fill="#f2d5a3">ANALYSE</text><path d="M468 236h264" stroke="#6d5e46"/>
