<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="t d"><title id="t">Théâtre grec : deux modes de lecture</title><desc id="d">Conserver le texte dramatique et l’analyse critique dans des parcours distincts : PIÈCE ET INTRIGUE, Témoins antiques et fragments, Personnages, scènes, action, Reconstitutions signalées, selon leur certitude; ANALYSE, Interprétations philosophiques, Philologie et dramaturgie, Contextes politiques, Hypothèses argumentées; RENVOIS, Lien entre les deux parcours, Ne pas inventer de vers, Identifier ce qui est perdu, et ce qui est reconstitué</desc><rect width="1200" height="550" fill="#0d1315"/><rect x="18" y="18" width="1164" height="514" rx="12" stroke="#685338" stroke-width="1" fill="none"/><text x="600" y="67" font-size="36" text-anchor="middle" font-family="Georgia,serif" fill="#f1d7a8">Théâtre grec : deux modes de lecture</text><text x="600" y="110" font-size="18" text-anchor="middle" font-family="Arial,sans-serif" fill="#d5c7b0">Conserver le texte dramatique et l’analyse critique dans des parcours distincts</text><rect x="50" y="158" width="340" height="237" rx="12" fill="#1f292b" stroke="#b99b6a" stroke-width="2"/><text x="220" y="215" text-anchor="middle" font-size="28" font-family="Georgia,serif" fill="#f2d5a3">PIÈCE ET INTRIGUE</text><path d="M88 236h264" stroke="#6d5e46"/>
<text x="220" y="275" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">Témoins antiques et fragments</text>
