<text x="980" y="275" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">Lien entre les deux parcours</text>
<text x="980" y="306" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">Ne pas inventer de vers</text>
<text x="980" y="337" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">Identifier ce qui est perdu</text>
<text x="980" y="368" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#e6dccc">et ce qui est reconstitué</text><text x="600" y="461" font-size="23" text-anchor="middle" font-family="Georgia,serif" fill="#f2dbba">Résumé et commentaire restent complémentaires, jamais confondus</text><text x="600" y="508" font-size="15" text-anchor="middle" font-family="Arial,sans-serif" fill="#bfb1a0">MYTHOS · 3 novembre 2026 · schéma contemporain assisté par IA · Aristote, Poétique</text></svg>