fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">ÉLAMITE</text><text x="595" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Langue de chancellerie</text><text x="595" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">traditionnelle de l’empire</text><text x="595" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Version de l’inscription</text><rect x="816" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="982" cy="204" r="22" fill="#ab8c5d"/><text x="982" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">3</text><text x="982" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">BABYLONIEN</text><text x="982" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Langue akkadienne</text><text x="982" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">de tradition mésopotamienne</text><text x="982" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Version de l’inscription</text><text x="600" y="484" text-anchor="middle" fill="#edd5af" font-family="Georgia,serif" font-size="23">Un témoignage historique réel, mais un récit royal partisan</text><text x="600" y="533" text-anchor="middle" fill="#d0c0aa" font-family="Arial,sans-serif" font-size="17">Référence : UNESCO, dossier de Bisotun (nº 1222)</text><text x="600" y="574" text-anchor="middle" fill="#aa9a85" font-family="Arial,sans-serif" font-size="15">MYTHOS · 3 novembre 2026 · création numérique contemporaine assistée par IA · non historique</text></svg>