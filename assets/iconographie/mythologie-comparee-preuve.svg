<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Comparer les mythes sans les confondre</title><desc id="desc">Analogie, circulation historique et hypothèses sont des opérations distinctes. ANALOGIE: Structures qui se ressemblent Motifs ou fonctions Constat comparatif sans lien causal établi. TRANSMISSION: Contacts documentés Chronologie compatible Indices linguistiques ou iconographiques. HYPOTHÈSE: Ressemblance inexpliquée Emprunt possible ? Explications concurrentes à expliciter</desc><rect width="1200" height="550" fill="#0d1315"/><rect x="18" y="18" width="1164" height="514" rx="12" fill="none" stroke="#6c5537" stroke-width="1"/><text x="600" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#f1d7a8">Comparer les mythes sans les confondre</text><text x="600" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d5c7b0">Analogie, circulation historique et hypothèses sont des opérations distinctes</text><g><rect x="50" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="220" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">ANALOGIE</text><line x1="80" y1="235" x2="360" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="220" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Structures qui se ressemblent</text><text x="220" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Motifs ou fonctions</text><text x="220" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Constat comparatif</text><text x="220" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">sans lien causal établi</text></g><g><rect x="430" y="159" widt