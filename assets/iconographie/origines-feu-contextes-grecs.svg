<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" role="img" aria-labelledby="titre desc"><title id="titre">Le feu dans les sources grecques : trois emplois à distinguer</title><desc id="desc">Le foyer d'Hestia, le sacrifice brûlé et le récit de Prométhée relèvent de contextes distincts et ne doivent pas être interprétés comme un unique rituel universel.</desc><rect width="1200" height="558" fill="#111719"/><text x="600" y="63" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#f0d5a5">Le feu : trois contextes grecs</text><text x="600" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e9e0d2">Un élément matériel, des fonctions religieuses différentes</text><rect x="48" y="152" width="347" height="235" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="221" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#f0d5a5">FOYER</text><text x="221" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Hestia et la continuité</text><text x="221" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">de l'espace domestique</text><text x="221" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">et civique</text><rect x="426" y="152" width="347" height="235" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="599" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#f0d5a5">SACRIFICE</text><text x="599" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Parts brûlées, fumée,</text><text x="599" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">honneurs rendus</text><text x="599" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">aux dieux</text><rect x="804" y="152" width="347" height="235" rx="14" fill="#20282b" stroke="#c1a16e" stroke-width="2.5"/><text x="977" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#f0d5a5">RÉCIT</text><text x="977" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">Prométhée et le feu :</text><text x="977" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">technique, partage</text><text x="977" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e9e0d2">et limite humaine</text><text x="600" y="452" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f2ddbb">Ne pas confondre pratique rituelle, institution et narration mythique.</text><text x="600" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c9beaf">Hymne homérique à Hestia · Iliade I · Théogonie 535–570</text><text x="600" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bcb1a3">MYTHOS · 3 novembre 2026 · schéma contemporain avec assistance IA · non historique</text></svg>