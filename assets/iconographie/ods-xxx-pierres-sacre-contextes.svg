<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Pierres sacrées : objets et fonctions</title><desc id="desc">Tome XXX · cultes locaux et contextes historiques. DELPHES, Omphalos : centre, symbolique de la Terre, Pausanias, X, 16, 3; MÉSOPOTAMIE, Kudurrus : actes, royaux inscrits et, symboles divins; MÉTHODE, Matériau, fonction, et contexte ne sont, pas interchangeables. Ne pas attribuer à toutes les pierres une fonction religieuse identique.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="65" text-anchor="middle" fill="#f1d5a5" font-family="Georgia,serif" font-size="37">Pierres sacrées : objets et fonctions</text><text x="600" y="108" text-anchor="middle" fill="#d9ccba" font-family="Arial,sans-serif" font-size="20">Tome XXX · cultes locaux et contextes historiques</text><g><rect x="42" y="165" width="345" height="246" rx="11" fill="#1d282b" stroke="#bfa171" stroke-width="3"/><text x="214.5" y="224" fill="#f5d7a5" font-family="Georgia,serif" font-size="29" text-anchor="middle">DELPHES</text><text x="214.5" y="277" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Omphalos : centre</text><text x="214.5" y="316" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">symbolique de la Terre</text><text x="214.5" y="355" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Pausanias, X, 16, 3</text></g><g><rect x="429" y="165" width="345" height="246" rx="11" fill="#1d282b" stroke="#bfa171" stroke-width="3"/><text x="601.5" y="224" fill="#f5d7a5" font-family="Georgia,serif" font-size="29" text-anchor="middle">MÉSOPOTAMIE</text><text x="601.5" y="277" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Kudurrus : actes</text><text x="601.5" y="316" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">royaux inscrits et</text><text x="601.5" y="355" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">symboles divins</text></g><g><rect x="816" y="165" width="345" height="246" rx="11" fill="#1d282b" stroke="#bfa171" stroke-width="3"/><text x="988.5" y="224" fill="#f5d7a5" font-family="Georgia,serif" font-size="29" text-anchor="middle">MÉTHODE</text><text x="988.5" y="277" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Matériau, fonction</text><text x="988.5" y="316" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">et contexte ne sont</text><text x="988.5" y="355" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">pas interchangeables</text></g><text x="600" y="468" text-anchor="middle" fill="#f0d7af" font-family="Georgia,serif" font-size="22">Ne pas attribuer à toutes les pierres une fonction religieuse identique</text><text x="600" y="516" text-anchor="middle" fill="#cbbbab" font-family="Arial,sans-serif" font-size="16">MYTHOS · schéma original assisté par IA · 3 novembre 2026 · non historique</text></svg>