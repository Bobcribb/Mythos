<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">Argonautes : étapes narratives de l'aller vers la Colchide</title><desc id="svgdesc">Schéma linéaire non cartographique : Iolcos, Lemnos, Propontide, Symplégades, Colchide; les itinéraires de retour varient selon les traditions.</desc><rect width="1200" height="600" fill="#101618"/><rect x="17" y="17" width="1166" height="566" rx="12" fill="none" stroke="#665439" stroke-width="2"/>
<text x="600" y="71" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#f0d3a2">Argonautes : le voyage vers la Colchide</text><text x="600" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d7c7b4">Jalons narratifs de l’aller dans les Argonautiques d’Apollonios</text>
<rect x="40" y="190" width="205" height="178" rx="12" fill="#202b2d" stroke="#bca072" stroke-width="3"/><text x="142.5" y="252" text-anchor="middle" fill="#ecd2a3" font-size="23" font-family="Georgia,serif">IOLCOS</text><text x="142.5" y="297" text-anchor="middle" fill="#e9dfd0" font-size="17" font-family="Arial,sans-serif">Départ et mission</text><path d="M 249 278 h 17 l -8 -9 m 8 9 -8 9" fill="none" stroke="#dac18d" stroke-width="3"/><rect x="271" y="190" width="205" height="178" rx="12" fill="#202b2d" stroke="#bca072" stroke-width="3"/><text x="373.5" y="252" text-anchor="middle" fill="#ecd2a3" font-size="23" font-family="Georgia,serif">LEMNOS</text><text x="373.5" y="297" text-anchor="middle" fill="#e9dfd0" font-size="17" font-family="Arial,sans-serif">Escale narrative</text><path d="M 480 278 h 17 l -8 -9 m 8 9 -8 9" fill="none" stroke="#dac18d" stroke-width="3"/><rect x="502" y="190" width="205" height="178" rx="12" fill="#202b2d" stroke="#bca072" stroke-width="3"/><text x="604.5" y="252" text-anchor="middle" fill="#ecd2a3" font-size="23" font-family="Georgia,serif">PROPONTIDE</text><text x="604.5" y="297" text-anchor="middle" fill="#e9dfd0" font-size="17" font-family="Arial,sans-serif">Épreuves et rencontres</text><path d="M 711 278 h 17 l -8 -9 m 8 9 -8 9" fill="none" stroke="#dac18d" stroke-width="3"/><rect x="733" y="190" width="205" height="178" rx="12" fill="#202b2d" stroke="#bca072" stroke-width="3"/><text x="835.5" y="252" text-anchor="middle" fill="#ecd2a3" font-size="23" font-family="Georgia,serif">SYMPLEGADES</text><text x="835.5" y="297" text-anchor="middle" fill="#e9dfd0" font-size="17" font-family="Arial,sans-serif">Passage périlleux</text><path d="M 942 278 h 17 l -8 -9 m 8 9 -8 9" fill="none" stroke="#dac18d" stroke-width="3"/><rect x="964" y="190" width="205" height="178" rx="12" fill="#202b2d" stroke="#bca072" stroke-width="3"/><text x="1066.5" y="252" text-anchor="middle" fill="#ecd2a3" font-size="23" font-family="Georgia,serif">COLCHIDE</text><text x="1066.5" y="297" text-anchor="middle" fill="#e9dfd0" font-size="17" font-family="Arial,sans-serif">Toison et Médée</text>
<text x="600" y="425" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#ead0a4">Un parcours de récit, non un tracé maritime vérifiable</text>
<text x="600" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#d5c8b7">Les récits divergent sur les itinéraires, notamment au retour.</text>
<text x="600" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c7b99f">Source : Apollonios de Rhodes, Argonautiques I–IV (IIIe siècle av. J.-C.)</text>
<text x="600" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#c1b7a7">Schéma narratif, non carte archéologique · MYTHOS, 3 novembre 2026 · schéma contemporain assisté par IA</text></svg>