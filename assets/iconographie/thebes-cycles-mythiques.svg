<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Cycle thébain : plusieurs traditions, une même cité</title><desc id="d">Quatre pôles mythologiques et dramatiques autour de Thèbes, sans présumer une version unique ni une chronologie historique.</desc><rect width="1200" height="590" fill="#101719"/><rect x="16" y="16" width="1168" height="558" rx="12" fill="none" stroke="#776044"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="39" fill="#f0d3a1">Thèbes : une cité, plusieurs cycles</text><text x="600" y="112" text-anchor="middle" fill="#d4c7b5" font-family="Arial,sans-serif" font-size="20">Des récits de fondation aux tragédies du pouvoir</text><rect x="40" y="178" width="266" height="228" rx="12" fill="#202b2c" stroke="#b99a6e" stroke-width="3"/><text x="173" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f0d3a1">CADMOS</text><text x="173" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#eaddc9">Fondation et autochtonie</text><rect x="332" y="178" width="266" height="228" rx="12" fill="#202b2c" stroke="#b99a6e" stroke-width="3"/><text x="465" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f0d3a1">DIONYSOS</text><text x="465" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#eaddc9">Sémélé et Penthée</text><rect x="624" y="178" width="266" height="228" rx="12" fill="#202b2c" stroke="#b99a6e" stroke-width="3"/><text x="757" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f0d3a1">ŒDIPE</text><text x="757" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#eaddc9">Énigme, identité, faute</text><rect x="916" y="178" width="266" height="228" rx="12" fill="#202b2c" stroke="#b99a6e" stroke-width="3"/><text x="1049" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f0d3a1">ANTIGONE</text><text x="1049" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#eaddc9">Sépulture, cité, conflit</text><text x="600" y="466" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#f0d3a1">La cité rassemble des versions et des temps de transmission différents.</text><text x="600" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d2c4b0">Sources : Euripide, Bacchantes ; Sophocle, Œdipe roi et Antigone ; autres traditions antiques</text><text x="600" y="559" text-anchor="middle" fill="#bfb2a0" font-family="Arial,sans-serif" font-size="16">MYTHOS · 3 novembre 2026 · conception vectorielle assistée par IA · non historique</text></svg>