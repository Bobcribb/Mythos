<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Lire un lieu de mythologie grecque</title><desc id="d">Trois catégories complémentaires : témoignages littéraires, pratiques cultuelles et vestiges archéologiques. Leurs chronologies peuvent différer.</desc><rect width="1200" height="560" fill="#0e1517"/><text x="600" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#edd1a1">Un lieu, plusieurs types de preuves</text><text x="600" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d9cbb6">Méthode pour l’atlas mythologique grec</text><g fill="#202b2c" stroke="#c1a06b" stroke-width="3"><rect x="50" y="166" width="342" height="244" rx="14"/><rect x="429" y="166" width="342" height="244" rx="14"/><rect x="808" y="166" width="342" height="244" rx="14"/></g><g text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#f1d6a6"><text x="221" y="226">RÉCITS</text><text x="600" y="226">CULTES</text><text x="979" y="226">VESTIGES</text></g><g text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8dfd1"><text x="221" y="277">Homère, Hésiode,</text><text x="221" y="312">Pausanias et variantes</text><text x="221" y="350">Datation des témoignages</text><text x="600" y="277">Rites, fêtes,</text><text x="600" y="312">épiclèses, dédicaces</text><text x="600" y="350">Contextes locaux</text><text x="979" y="277">Temples, inscriptions,</text><text x="979" y="312">objets et stratigraphie</text><text x="979" y="350">Datation matérielle</text></g><text x="600" y="467" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#edd8b7">Les récits ne datent pas nécessairement des monuments qu’ils évoquent.</text><text x="600" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bfb4a5">MYTHOS · schéma pédagogique vectoriel original · 2026 · non historique · non généré par IA</text></svg>