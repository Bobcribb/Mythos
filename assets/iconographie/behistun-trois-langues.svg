<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Behistun : une autorité, plusieurs langues</title><desc id="desc">Monument commandé par Darius Ier, vers 521 av. J.-C.. VIEUX PERSE: Écriture cunéiforme Formulation royale et justification dynastique Version ajoutée par étapes. ÉLAMITE: Écriture cunéiforme Tradition scribale de l’Empire Version du monument. BABYLONIEN: Dialecte de l’akkadien Écriture cunéiforme Diffusion impériale du récit royal</desc><rect width="1200" height="550" fill="#0d1315"/><rect x="18" y="18" width="1164" height="514" rx="12" fill="none" stroke="#6c5537" stroke-width="1"/><text x="600" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#f1d7a8">Behistun : une autorité, plusieurs langues</text><text x="600" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d5c7b0">Monument commandé par Darius Ier, vers 521 av. J.-C.</text><g><rect x="50" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="220" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">VIEUX PERSE</text><line x1="80" y1="235" x2="360" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="220" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Écriture cunéiforme</text><text x="220" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Formulation royale</text><text x="220" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">et justification dynastique</text><text x="220" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Version ajoutée par étapes</text></g><g><rect x="430" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="600" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">ÉLAMITE</text><line x1="460" y1="235" x2="740" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="600" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Écriture cunéiforme</text><text x="600" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Tradition scribale</text><text x="600" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">de l’Empire</text><text x="600" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Version du monument</text></g><g><rect x="810" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="980" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">BABYLONIEN</text><line x1="840" y1="235" x2="1120" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="980" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Dialecte de l’akkadien</text><text x="980" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Écriture cunéiforme</text><text x="980" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Diffusion impériale</text><text x="980" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">du récit royal</text></g><text x="600" y="459" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#f1dcba">Versions proches, sans supposer une équivalence mot à mot</text><text x="600" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bcb0a0">MYTHOS · 3 novembre 2026 · schéma contemporain (assistance IA) · d’après UNESCO, Bisotun</text></svg>