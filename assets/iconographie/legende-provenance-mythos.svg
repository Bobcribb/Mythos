<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Légende de provenance des illustrations MYTHOS</title><desc id="desc">Trois catégories à distinguer : document historique reproduit et sourcé, reconstitution moderne hypothétique, schéma pédagogique contemporain assisté par IA.</desc><rect width="1200" height="545" fill="#0d1315"/><rect x="18" y="18" width="1164" height="509" rx="12" stroke="#786042" fill="none"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#f0d4a7">Comment lire une illustration MYTHOS ?</text><text x="600" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d4c7b5">Le statut de l’image change ce qu’elle peut prouver</text><g fill="#202a2b" stroke="#bc9f70" stroke-width="2"><rect x="45" y="159" width="344" height="238" rx="12"/><rect x="428" y="159" width="344" height="238" rx="12"/><rect x="811" y="159" width="344" height="238" rx="12"/></g><g text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f2d6a5"><text x="217" y="211">DOCUMENT HISTORIQUE</text><text x="600" y="211">RECONSTITUTION</text><text x="983" y="211">SCHÉMA CONTEMPORAIN</text></g><g text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e8ddcf"><text x="217" y="259">Objet, inscription, photographie</text><text x="217" y="291">Cote, lieu, période, auteur</text><text x="217" y="323">Licence et reproduction</text><text x="217" y="355">À sourcer précisément</text><text x="600" y="259">Vue moderne d’un état ancien</text><text x="600" y="291">Niveau de certitude</text><text x="600" y="323">Parties conservées / supposées</text><text x="600" y="355">Jamais une photographie antique</text><text x="983" y="259">Synthèse ou diagramme</text><text x="983" y="291">Texte ou données de référence</text><text x="983" y="323">Date et procédé de création</text><text x="983" y="355">Aucune preuve matérielle directe</text></g><text x="600" y="461" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#edd8b9">Source, datation, statut, droits et incertitudes : chaque légende doit les préciser</text><text x="600" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bfb3a5">MYTHOS · 3 novembre 2026 · schéma de provenance assisté par IA · création pédagogique non historique</text></svg>