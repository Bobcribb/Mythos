<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Kôkalos : que peut-on réellement savoir ?</title><desc id="desc">Une comédie perdue attribuée à Aristophane · distinguer les preuves. TÉMOIGNAGES: Titre et mentions antiques sur la pièce Données directes mais fragmentaires. MYTHE INDÉPENDANT: Dédale, Minos, Cocalos Récits transmis ailleurs Ne prouvent pas les scènes de la pièce. HYPOTHÈSES: Scénarios et comparaisons inventés par les modernes Outils d’interprétation non fragments antiques</desc><rect width="1200" height="550" fill="#0d1315"/><rect x="18" y="18" width="1164" height="514" rx="12" fill="none" stroke="#6c5537" stroke-width="1"/><text x="600" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#f1d7a8">Kôkalos : que peut-on réellement savoir ?</text><text x="600" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d5c7b0">Une comédie perdue attribuée à Aristophane · distinguer les preuves</text><g><rect x="50" y="159" width="340" height="236" rx="12" fill="#1f292b" stroke="#bfa06a" stroke-width="2"/><text x="220" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#f2d5a3">TÉMOIGNAGES</text><line x1="80" y1="235" x2="360" y2="235" stroke="#6d5e46" stroke-width="1"/><text x="220" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Titre et mentions</text><text x="220" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">antiques sur la pièce</text><text x="220" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">Données directes</text><text x="220" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8ddcc">mais fragmentaires</text></g><g><rect x="430" y="159" width="340" height="2