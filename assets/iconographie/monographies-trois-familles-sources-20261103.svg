<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Lire une divinité grecque dans les sources</title><desc id="desc">Le même dieu n’a pas exactement le même profil dans tous les documents. RÉCITS: Poèmes, hymnes et mythes Généalogies et variantes Homère ; Hésiode; CULTES: Sanctuaires, épithètes Rites, inscriptions Pausanias ; témoignages locaux; IMAGES: Vases, statues, reliefs Attributs et scènes figurées Contexte et datation essentiels.</desc><rect width="1200" height="600" fill="#0c1215"/><path d="M42 126H1158" stroke="#6d573b" stroke-width="2"/><text x="600" y="63" text-anchor="middle" fill="#f0d3a2" font-family="Georgia,serif" font-size="37">Lire une divinité grecque dans les sources</text><text x="600" y="104" text-anchor="middle" fill="#d5c5b1" font-family="Arial,sans-serif" font-size="20">Le même dieu n’a pas exactement le même profil dans tous les documents</text><rect x="42" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="208" cy="204" r="22" fill="#ab8c5d"/><text x="208" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">1</text><text x="208" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">RÉCITS</text><text x="208" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Poèmes, hymnes et mythes</text><text x="208" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Généalogies et variantes</text><text x="208" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Homère ; Hésiode</text><rect x="429" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="595" cy="204" r="22" fill="#ab8c5d"/><text x="595" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">2</text><text x="595" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">CULTES</text><text x="595" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Sanctuaires, épithètes</text><text x="595" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Rites, inscriptions</text><text x="595" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Pausanias ; témoignages locaux</text><rect x="816" y="167" width="342" height="263" rx="13" fill="#1d282a" stroke="#c4a471" stroke-width="2"/><circle cx="982" cy="204" r="22" fill="#ab8c5d"/><text x="982" y="211" fill="#111719" font-size="21" font-family="Georgia,serif" text-anchor="middle">3</text><text x="982" y="254" fill="#f0d3a2" font-family="Georgia,serif" font-size="26" text-anchor="middle">IMAGES</text><text x="982" y="302" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Vases, statues, reliefs</text><text x="982" y="335" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Attributs et scènes figurées</text><text x="982" y="368" fill="#e8dfce" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Contexte et datation essentiels</text><text x="600" y="484" text-anchor="middle" fill="#edd5af" font-family="Georgia,serif" font-size="23">Ne pas confondre narration, pratique cultuelle et représentation</text><text x="600" y="533" text-anchor="middle" fill="#d0c0aa" font-family="Arial,sans-serif" font-size="17">Repères de méthode : sources littéraires, épigraphiques et archéologiques</text><text x="600" y="574" text-anchor="middle" fill="#aa9a85" font-family="Arial,sans-serif" font-size="15">MYTHOS · 3 novembre 2026 · création numérique contemporaine assistée par IA · non historique</text></svg>