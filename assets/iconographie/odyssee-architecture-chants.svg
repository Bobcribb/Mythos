<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Odyssée en 24 chants : architecture narrative</title><desc id="d">Quatre ensembles de chants : I à IV Télémachie, V à VIII arrivée des Phéaciens, IX à XII récits d'Ulysse, XIII à XXIV retour à Ithaque.</desc><rect width="1200" height="590" fill="#101719"/><rect x="16" y="16" width="1168" height="558" rx="12" fill="none" stroke="#776044"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="39" fill="#f0d3a1">L’Odyssée : une architecture en 24 chants</text><text x="600" y="112" text-anchor="middle" fill="#d4c7b5" font-family="Arial,sans-serif" font-size="19">Ordre du poème, temps raconté et retours en arrière</text><rect x="40" y="180" width="265" height="237" rx="11" fill="#202b2b" stroke="#b99a6e" stroke-width="3"/><text x="172" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#f0d3a1">I–IV</text><text x="172" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#eaddc9">LA TÉLÉMACHIE</text><text x="172" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d3c6b3">Recherche des nouvelles</text><rect x="332" y="180" width="265" height="237" rx="11" fill="#202b2b" stroke="#b99a6e" stroke-width="3"/><text x="464" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#f0d3a1">V–VIII</text><text x="464" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#eaddc9">LE RETOUR RELANCÉ</text><text x="464" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d3c6b3">D’Ogygie aux Phéaciens</text><rect x="624" y="180" width="265" height="237" rx="11" fill="#202b2b" stroke="#b99a6e" stroke-width="3"/><text x="756" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#f0d3a1">IX–XII</text><text x="756" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#eaddc9">RÉCITS D’ULYSSE</text><text x="756" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d3c6b3">Aventures racontées</text><rect x="916" y="180" width="265" height="237" rx="11" fill="#202b2b" stroke="#b99a6e" stroke-width="3"/><text x="1048" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#f0d3a1">XIII–XXIV</text><text x="1048" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#eaddc9">ITHAQUE</text><text x="1048" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d3c6b3">Reconnaissance et conflit</text><text x="600" y="473" text-anchor="middle" fill="#ebd2a7" font-family="Georgia,serif" font-size="25">Les chants IX–XII sont largement rétrospectifs : Ulysse devient narrateur.</text><text x="600" y="516" text-anchor="middle" fill="#d2c4b0" font-family="Arial,sans-serif" font-size="17">Source : Homère, Odyssée, chants I–XXIV. Regroupement pédagogique contemporain.</text><text x="600" y="559" text-anchor="middle" fill="#bfb2a0" font-family="Arial,sans-serif" font-size="16">MYTHOS · 3 novembre 2026 · conception vectorielle assistée par IA · non historique</text></svg>