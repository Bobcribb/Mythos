<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Images divines : objet et rite</title><desc id="desc">Tome XXXI · présence cultuelle et sources documentaires. FABRICATION, Image façonnée, dans un atelier :, un objet matériel; CONSÉCRATION, Mīs pî mésopotamien :, rituel lié à l’image, Walker et Dick, 2001; CULTE, Entretien, service, et usages de l’image, selon les traditions. Une image cultuelle ne se réduit ni à sa matière ni à une « idole » universelle.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="65" text-anchor="middle" fill="#f1d5a5" font-family="Georgia,serif" font-size="37">Images divines : objet et rite</text><text x="600" y="108" text-anchor="middle" fill="#d9ccba" font-family="Arial,sans-serif" font-size="20">Tome XXXI · présence cultuelle et sources documentaires</text><g><rect x="42" y="165" width="345" height="246" rx="11" fill="#1d282b" stroke="#bfa171" stroke-width="3"/><text x="214.5" y="224" fill="#f5d7a5" font-family="Georgia,serif" font-size="29" text-anchor="middle">FABRICATION</text><text x="214.5" y="277" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Image façonnée</text><text x="214.5" y="316" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">dans un atelier :</text><text x="214.5" y="355" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">un objet matériel</text></g><g><rect x="429" y="165" width="345" height="246" rx="11" fill="#1d282b" stroke="#bfa171" stroke-width="3"/><text x="601.5" y="224" fill="#f5d7a5" font-family="Georgia,serif" font-size="29" text-anchor="middle">CONSÉCRATION</text><text x="601.5" y="277" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Mīs pî mésopotamien :</text><text x="601.5" y="316" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">rituel lié à l’image</text><text x="601.5" y="355" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Walker et Dick, 2001</text></g><g><rect x="816" y="165" width="345" height="246" rx="11" fill="#1d282b" stroke="#bfa171" stroke-width="3"/><text x="988.5" y="224" fill="#f5d7a5" font-family="Georgia,serif" font-size="29" text-anchor="middle">CULTE</text><text x="988.5" y="277" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Entretien, service</text><text x="988.5" y="316" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">et usages de l’image</text><text x="988.5" y="355" fill="#eee4d5" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">selon les traditions</text></g><text x="600" y="468" text-anchor="middle" fill="#f0d7af" font-family="Georgia,serif" font-size="22">Une image cultuelle ne se réduit ni à sa matière ni à une « idole » universelle</text><text x="600" y="516" text-anchor="middle" fill="#cbbbab" font-family="Arial,sans-serif" font-size="16">MYTHOS · schéma original assisté par IA · 3 novembre 2026 · non historique</text></svg>