<title id="titre">Télémaque : une identité en construction</title><desc id="description">Schéma des trois dimensions de la Télémachie : absence du père, enquête auprès de Nestor et Ménélas, action et parole du fils.</desc>
<rect width="1200" height="650" fill="#0d1518"/>
<rect x="16" y="17" width="1168" height="616" rx="20" fill="none" stroke="#594932" stroke-width="2"/>
<text x="600" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#e9c98f">Télémaque : une identité en construction</text>
<text x="600" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d4c4ab">Odyssée I–IV — mémoire des autres et prise de parole</text>
<rect x="33" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="47" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="205" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LE MANQUE</text><text x="205" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">L’absence d’Ulysse</text><text x="205" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Une filiation incertaine</text><text x="205" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Les prétendants à Ithaque</text><rect x="429" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="443" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="601" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">L’ENQUÊTE</text><text x="601" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Nestor à Pylos (III)</text><text x="601" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Ménélas à Sparte (IV)</text><text x="601" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Témoignages et récits</text><rect x="825" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="839" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="997" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">L’ACTION</text><text x="997" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Décider de partir</text><text x="997" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Questionner les témoins</text><text x="997" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Assumer sa parole</text>
<text x="600" y="508" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#e9cfac">La mémoire transmise éclaire le passé ; elle ne dispense pas Télémaque d’agir.</text>
