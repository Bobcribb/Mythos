<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Timê et kleos : deux formes de reconnaissance héroïque</title><desc id="d">Schéma pédagogique opposant l'honneur reçu des contemporains à la renommée transmise par le récit, tous deux confrontés à la mortalité.</desc><rect width="1200" height="500" fill="#101719"/><text x="600" y="65" text-anchor="middle" font-family="Georgia,serif" font-size="39" fill="#ebd2a4">Honneur et mémoire dans l’Iliade</text><rect x="70" y="125" width="475" height="205" rx="12" fill="#202a2b" stroke="#bd9b63" stroke-width="3"/><rect x="655" y="125" width="475" height="205" rx="12" fill="#202a2b" stroke="#bd9b63" stroke-width="3"/><text x="307" y="185" text-anchor="middle" font-size="34" font-family="Georgia,serif" fill="#f3d7a7">TIMÊ — τιμή</text><text x="307" y="235" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#eee4d5">Honneur accordé au présent</text><text x="307" y="273" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#d3c6b3">parts, dons, statut, respect</text><text x="892" y="185" text-anchor="middle" font-size="34" font-family="Georgia,serif" fill="#f3d7a7">KLEOS — κλέος</text><text x="892" y="235" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#eee4d5">Renommée transmise dans le temps</text><text x="892" y="273" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#d3c6b3">chant, récit, mémoire collective</text><path d="M307 330 V377 H600 M892 330 V377 H600 V402" fill="none" stroke="#bd9b63" stroke-width="3"/><text x="600" y="444" text-anchor="middle" font-size="25" font-family="Georgia,serif" fill="#f0e3ce">La mortalité rend ces deux valeurs précieuses et problématiques</text><text x="600" y="478" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#b9b1a5">MYTHOS · schéma interprétatif contemporain · Iliade I et IX · non historique</text></svg>