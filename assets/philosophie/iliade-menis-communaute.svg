<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">La mênis : du grief à la crise collective</title><desc id="desc">Iliade I · la colère comme problème politique — L’offense : Agamemnon retire Briséis : à Achille : → atteinte à la timê ; Le retrait : Achille quitte le combat : et sollicite Thétis : → rupture de solidarité ; La crise : Le conflit entre chefs : fragilise l’armée : → coût collectif. Une blessure d’honneur devient une affaire de communauté.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#efd4a2">La mênis : du grief à la crise collective</text><text x="600" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d2c6b7">Iliade I · la colère comme problème politique</text><rect x="45" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="218" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">L’offense</text><text x="218" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Agamemnon retire Briséis</text><text x="218" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">à Achille</text><text x="218" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">→ atteinte à la timê</text><rect x="430" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="603" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Le retrait</text><text x="603" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Achille quitte le combat</text><text x="603" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">et sollicite Thétis</text><text x="603" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">→ rupture de solidarité</text><rect x="815" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="988" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">La crise</text><text x="988" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Le conflit entre chefs</text><text x="988" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">fragilise l’armée</text><text x="988" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">→ coût collectif</text><text x="600" y="465" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f1dfc1">Une blessure d’honneur devient une affaire de communauté.</text><text x="600" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bdb2a2">Homère, Iliade I, 101–427 ; lecture analytique MYTHOS.</text><text x="600" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a79e92">MYTHOS · 2026 · création vectorielle pédagogique assistée par IA · non historique</text></svg>