 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">01 · V. 116–122</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">ÉMERGENCE</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">Chaos, Gaïa, Tartare,</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">Éros : premières puissances.</text>
 <path d="M22 270 H336" stroke="#6a5940" stroke-width="1"/>
