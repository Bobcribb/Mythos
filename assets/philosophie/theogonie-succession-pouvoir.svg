 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">03 · V. 453–506</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">CRONOS / ZEUS</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">La ruse de Rhéa déjoue</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">la dévoration dynastique.</text>
