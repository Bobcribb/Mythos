 <text x="48" y="92" font-size="43" fill="#f1d3a2" font-family="Georgia,serif">THÉOGONIE · GÉNÉALOGIE DU POUVOIR</text>
 <text x="49" y="144" font-size="24" fill="#c8b99e" font-family="Georgia,serif">Une lecture de la succession des puissances : récit mythique, non traité politique</text>
 <g transform="translate(45 204)">
 <rect x="0" y="0" width="358" height="366" rx="13" fill="#182026" stroke="#8d7755" stroke-width="2"/>
