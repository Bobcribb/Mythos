 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">02 · V. 154–210</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">OURANOS</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">Le blocage des enfants</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">déclenche une rupture.</text>
 <path d="M22 270 H336" stroke="#6a5940" stroke-width="1"/>
 <text x="22" y="315" fill="#c8bda8" font-size="19" font-family="Arial,sans-serif">Lecture critique · MYTHOS</text>
 </g>
