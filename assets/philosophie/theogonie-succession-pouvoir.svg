 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">ORDRE DE ZEUS</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">La souveraineté s’associe</text>
