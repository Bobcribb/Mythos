 <title id="svgtitle">THÉOGONIE · GÉNÉALOGIE DU POUVOIR</title>
 <desc id="svgdesc">Une lecture de la succession des puissances : récit mythique, non traité politique. Diagramme pédagogique de quatre étapes.</desc>
 <rect width="1600" height="725" fill="#0b1115"/>
