<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Achille aux Enfers : la vie avant la gloire ?</title><desc id="desc">Odyssée XI · débat intérieur à l’idéal héroïque — La renommée : Le kleos promet : de conserver le nom : du guerrier après sa mort ; La parole d’Achille : L’ombre préfère : une vie humble : à la royauté des morts ; La question : Quel bien peut compenser : la perte de l’expérience : même de vivre ?. Le récit met à l’épreuve le prestige posthume sans abolir l’héroïsme.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#efd4a2">Achille aux Enfers : la vie avant la gloire ?</text><text x="600" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d2c6b7">Odyssée XI · débat intérieur à l’idéal héroïque</text><rect x="45" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="218" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">La renommée</text><text x="218" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Le kleos promet</text><text x="218" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">de conserver le nom</text><text x="218" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">du guerrier après sa mort</text><rect x="430" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="603" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">La parole d’Achille</text><text x="603" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">L’ombre préfère</text><text x="603" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">une vie humble</text><text x="603" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">à la royauté des morts</text><rect x="815" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="988" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">La question</text><text x="988" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Quel bien peut compenser</text><text x="988" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">la perte de l’expérience</text><text x="988" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">même de vivre ?</text><text x="600" y="465" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f1dfc1">Le récit met à l’épreuve le prestige posthume sans abolir l’héroïsme.</text><text x="600" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bdb2a2">Homère, Odyssée XI, 471–491 ; rapprochement avec Iliade IX.</text><text x="600" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a79e92">MYTHOS · 2026 · création vectorielle pédagogique assistée par IA · non historique</text></svg>