<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Xenia : l’épreuve de l’étranger</title><desc id="desc">Odyssée · l’hospitalité comme norme morale — Accueillir : Les Phéaciens offrent : sécurité et nourriture : avant le retour ; Violer : Polyphème refuse : les obligations de : l’hôte envers l’étranger ; Interroger : Qui protège le voyageur : quand il n’a ni parenté : ni autorité locale ?. La xenia transforme l’accueil en devoir et la violence en transgression.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#efd4a2">Xenia : l’épreuve de l’étranger</text><text x="600" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d2c6b7">Odyssée · l’hospitalité comme norme morale</text><rect x="45" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="218" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Accueillir</text><text x="218" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Les Phéaciens offrent</text><text x="218" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">sécurité et nourriture</text><text x="218" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">avant le retour</text><rect x="430" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="603" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Violer</text><text x="603" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Polyphème refuse</text><text x="603" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">les obligations de</text><text x="603" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">l’hôte envers l’étranger</text><rect x="815" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="988" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Interroger</text><text x="988" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Qui protège le voyageur</text><text x="988" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">quand il n’a ni parenté</text><text x="988" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">ni autorité locale ?</text><text x="600" y="465" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f1dfc1">La xenia transforme l’accueil en devoir et la violence en transgression.</text><text x="600" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bdb2a2">Homère, Odyssée VI–VIII ; IX, 252–306.</text><text x="600" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a79e92">MYTHOS · 2026 · création vectorielle pédagogique assistée par IA · non historique</text></svg>