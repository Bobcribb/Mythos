<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="570" viewBox="0 0 1300 570" role="img" aria-labelledby="title desc"><title id="title">Gaïa et Ouranos : une succession empêchée</title><desc id="desc">Schéma interprétatif : génération des enfants de Gaïa, blocage par Ouranos, intervention violente de Cronos, possibilité de succession. Non document antique.</desc><rect width="1300" height="570" fill="#13191a"/><path d="M35 28h1230M35 542h1230" stroke="#9f814e" stroke-width="2"/><text x="650" y="76" font-family="Georgia,serif" font-size="36" fill="#f5d8a8" text-anchor="middle">Gaïa et Ouranos : une succession empêchée</text><text x="650" y="119" font-family="Arial,sans-serif" font-size="19" fill="#ddd0bc" text-anchor="middle">MYTHOS · schéma analytique contemporain</text><rect x="40" y="178" width="281" height="240" rx="14" fill="#222b2b" stroke="#c9a56e" stroke-width="3"/><rect x="46" y="184" width="269" height="228" rx="10" fill="none" stroke="#76674b" stroke-width="1"/><text x="180.5" y="240" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#f6d8a7">GÉNÉRATION</text><path d="M95 263h171" stroke="#c9a56e" stroke-width="1" opacity=".65"/><text x="180.5" y="312" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">Gaïa donne naissance</text><text x="180.5" y="346" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">aux puissances</text><rect x="353" y="178" width="281" height="240" rx="14" fill="#222b2b" stroke="#c9a56e" stroke-width="3"/><rect x="359" y="184" width="269" height="228" rx="10" fill="none" stroke="#76674b" stroke-width="1"/><text x="493.5" y="240" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#f6d8a7">BLOCAGE</text><path d="M408 263h171" stroke="#c9a56e" stroke-width="1" opacity=".65"/><text x="493.5" y="312" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">Ouranos empêche</text><text x="493.5" y="346" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">les enfants de paraître</text><rect x="666" y="178" width="281" height="240" rx="14" fill="#222b2b" stroke="#c9a56e" stroke-width="3"/><rect x="672" y="184" width="269" height="228" rx="10" fill="none" stroke="#76674b" stroke-width="1"/><text x="806.5" y="240" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#f6d8a7">RUPTURE</text><path d="M721 263h171" stroke="#c9a56e" stroke-width="1" opacity=".65"/><text x="806.5" y="312" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">Cronos attaque</text><text x="806.5" y="346" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">son père</text><rect x="979" y="178" width="281" height="240" rx="14" fill="#222b2b" stroke="#c9a56e" stroke-width="3"/><rect x="985" y="184" width="269" height="228" rx="10" fill="none" stroke="#76674b" stroke-width="1"/><text x="1119.5" y="240" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#f6d8a7">OUVERTURE</text><path d="M1034 263h171" stroke="#c9a56e" stroke-width="1" opacity=".65"/><text x="1119.5" y="312" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">La succession</text><text x="1119.5" y="346" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#e8e0d3">devient possible</text><path d="M328 294h18m-8-8 8 8-8 8" stroke="#d9b777" stroke-width="4" fill="none"/><path d="M641 294h18m-8-8 8 8-8 8" stroke="#d9b777" stroke-width="4" fill="none"/><path d="M954 294h18m-8-8 8 8-8 8" stroke="#d9b777" stroke-width="4" fill="none"/><text x="650" y="473" font-family="Arial,sans-serif" font-size="19" fill="#d6c6af" text-anchor="middle">La rupture mythique ne constitue pas une justification politique de la violence.</text><text x="650" y="518" font-family="Arial,sans-serif" font-size="17" fill="#b9af9f" text-anchor="middle">Création MYTHOS assistée par IA · 3 novembre 2026 · non historique</text></svg>