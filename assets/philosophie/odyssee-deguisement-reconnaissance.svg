<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="t d"><title id="t">Ulysse : déguisement, preuve et reconnaissance</title><desc id="d">Diagramme interprétatif du déguisement d'Ulysse à Ithaque, de l'observation des proches et des signes de reconnaissance.</desc><rect width="1200" height="530" fill="#101719"/><text x="600" y="65" font-family="Georgia,serif" font-size="37" fill="#f0d4a6" text-anchor="middle">L’identité éprouvée par le déguisement</text><text x="600" y="106" font-family="Arial,sans-serif" font-size="20" fill="#d5c6b2" text-anchor="middle">Odyssée XIII–XXIII · apparence, mémoire, reconnaissance</text><g fill="#202a2b" stroke="#bd9d67" stroke-width="3"><rect x="48" y="165" width="335" height="205" rx="12"/><rect x="432" y="165" width="335" height="205" rx="12"/><rect x="816" y="165" width="335" height="205" rx="12"/></g><g font-family="Georgia,serif" font-size="29" fill="#f0d4a6" text-anchor="middle"><text x="215" y="225">APPARENCE</text><text x="600" y="225">ÉPREUVE</text><text x="983" y="225">RECONNAISSANCE</text></g><g font-family="Arial,sans-serif" font-size="20" fill="#e9dfd0" text-anchor="middle"><text x="215" y="277">Ulysse se présente</text><text x="215" y="310">comme un mendiant</text><text x="600" y="277">Il observe fidélités</text><text x="600" y="310">et comportements</text><text x="983" y="277">Cicatrice et lit</text><text x="983" y="310">réactivent la mémoire</text></g><path d="M388 268h35m-12-12 12 12-12 12M773 268h35m-12-12 12 12-12 12" fill="none" stroke="#d3b47c" stroke-width="4"/><text x="600" y="436" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#efddc0">Être reconnu exige plus qu’être simplement vu</text><text x="600" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#bfb3a4">MYTHOS · schéma pédagogique original, 2026 · non historique · Odyssée XIX et XXIII</text></svg>