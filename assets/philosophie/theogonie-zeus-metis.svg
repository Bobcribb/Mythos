<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="titre description">
<title id="titre">Zeus et Métis : gouverner l’avenir</title><desc id="description">Schéma interprétatif : prédiction d’une succession, ingestion de Métis enceinte par Zeus, incorporation de l’intelligence et consolidation du pouvoir.</desc>
<rect width="1200" height="650" fill="#0d1518"/>
<rect x="16" y="17" width="1168" height="616" rx="20" fill="none" stroke="#594932" stroke-width="2"/>
<text x="600" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#e9c98f">Zeus et Métis : gouverner l’avenir</text>
<text x="600" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d4c4ab">Hésiode, Théogonie, vers 886–900 — ruse et pouvoir</text>
<rect x="33" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="47" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="205" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LA PRÉDICTION</text><text x="205" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Métis porte Athéna</text><text x="205" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Un fils est annoncé</text><text x="205" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">La succession inquiète</text><rect x="429" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="443" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="601" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LA CONTRAINTE</text><text x="601" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Zeus trompe Métis</text><text x="601" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Il l’avale enceinte</text><text x="601" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Une violence dynastique</text><rect x="825" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="839" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="997" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LE POUVOIR</text><text x="997" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Rivalité écartée</text><text x="997" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Prévoyance incorporée</text><text x="997" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Souveraineté consolidée</text>
<text x="600" y="508" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#e9cfac">La consolidation de Zeus n’abolit pas la violence : elle la reconfigure.</text>
