<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Prométhée : ruse, feu et partage</title><desc id="desc">Théogonie 507–616 · l’écart entre dieux et mortels — Le partage : La ruse de Méconè : met en scène l’ordre : des parts sacrificielles ; Le feu : Zeus le dérobe : aux humains ; Prométhée : le récupère par ruse ; La sanction : L’épisode situe : les contraintes de : la condition humaine. La ruse ne supprime ni la puissance de Zeus ni l’inégalité des conditions.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#efd4a2">Prométhée : ruse, feu et partage</text><text x="600" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d2c6b7">Théogonie 507–616 · l’écart entre dieux et mortels</text><rect x="45" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="218" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Le partage</text><text x="218" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">La ruse de Méconè</text><text x="218" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">met en scène l’ordre</text><text x="218" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">des parts sacrificielles</text><rect x="430" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="603" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Le feu</text><text x="603" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Zeus le dérobe</text><text x="603" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">aux humains ; Prométhée</text><text x="603" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">le récupère par ruse</text><rect x="815" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="988" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">La sanction</text><text x="988" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">L’épisode situe</text><text x="988" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">les contraintes de</text><text x="988" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">la condition humaine</text><text x="600" y="465" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f1dfc1">La ruse ne supprime ni la puissance de Zeus ni l’inégalité des conditions.</text><text x="600" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bdb2a2">Hésiode, Théogonie 535–616 ; à distinguer de Travaux et les Jours.</text><text x="600" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a79e92">MYTHOS · 2026 · création vectorielle pédagogique assistée par IA · non historique</text></svg>