 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">02 · CHANT IX</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">MÊTIS</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">La ruse du « Personne »</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">assure la survie.</text>
 <path d="M22 270 H336" stroke="#6a5940" stroke-width="1"/>
 <text x="22" y="315" fill="#c8bda8" font-size="19" font-family="Arial,sans-serif">Lecture critique · MYTHOS</text>
 </g>
<g transform="translate(825 204)">
 <rect x="0" y="0" width="358" height="366" rx="13" fill="#182026" stroke="#8d7755" stroke-width="2"/>
 <path d="M0 55 H358" stroke="#8d7755" stroke-width="2"/>
 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">03 · CHANT XIX</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">MÉMOIRE DU CORPS</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">Euryclée reconnaît</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">la cicatrice du héros.</text>
 <path d="M22 270 H336" stroke="#6a5940" stroke-width="1"/>
 <text x="22" y="315" fill="#c8bda8" font-size="19" font-family="Arial,sans-serif">Lecture critique · MYTHOS</text>
 </g>
<g transform="translate(1215 204)">
 <rect x="0" y="0" width="358" height="366" rx="13" fill="#182026" stroke="#8d7755" stroke-width="2"/>
 <path d="M0 55 H358" stroke="#8d7755" stroke-width="2"/>
 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">04 · CHANT XXIII</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">IDENTITÉ PARTAGÉE</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">Le secret du lit vérifie</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">le lien avec Pénélope.</text>
 <path d="M22 270 H336" stroke="#6a5940" stroke-width="1"/>
