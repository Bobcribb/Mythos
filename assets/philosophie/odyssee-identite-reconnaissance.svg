 <title id="svgtitle">L’ODYSSÉE · IDENTITÉ ET RETOUR</title>
 <desc id="svgdesc">Du choix de vivre en mortel aux preuves de reconnaissance à Ithaque. Diagramme pédagogique de quatre étapes.</desc>
 <rect width="1600" height="725" fill="#0b1115"/>
 <rect x="20" y="20" width="1560" height="685" fill="none" stroke="#ab8657" stroke-width="2"/>
 <text x="48" y="92" font-size="43" fill="#f1d3a2" font-family="Georgia,serif">L’ODYSSÉE · IDENTITÉ ET RETOUR</text>
 <text x="49" y="144" font-size="24" fill="#c8b99e" font-family="Georgia,serif">Du choix de vivre en mortel aux preuves de reconnaissance à Ithaque</text>
 <g transform="translate(45 204)">
 <rect x="0" y="0" width="358" height="366" rx="13" fill="#182026" stroke="#8d7755" stroke-width="2"/>
 <path d="M0 55 H358" stroke="#8d7755" stroke-width="2"/>
 <text x="22" y="36" fill="#c5a572" font-size="19" font-family="Arial,sans-serif" letter-spacing="2">01 · CHANT V</text>
 <text x="22" y="113" fill="#f4dcaa" font-size="29" font-family="Georgia,serif">FINITUDE</text>
 <text x="22" y="174" fill="#f2ede3" font-size="23" font-family="Georgia,serif">Ulysse choisit le retour</text>
 <text x="22" y="213" fill="#f2ede3" font-size="23" font-family="Georgia,serif">plutôt que Calypso.</text>
 <path d="M22 270 H336" stroke="#6a5940" stroke-width="1"/>
 <text x="22" y="315" fill="#c8bda8" font-size="19" font-family="Arial,sans-serif">Lecture critique · MYTHOS</text>
 </g>
<g transform="translate(435 204)">
 <rect x="0" y="0" width="358" height="366" rx="13" fill="#182026" stroke="#8d7755" stroke-width="2"/>
