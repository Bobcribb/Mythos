<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Chaos, Gaïa, Tartare et Éros chez Hésiode</title><desc id="d">Diagramme interprétatif des puissances primordiales nommées dans la Théogonie aux vers 116 à 122, sans suggérer qu'elles forment une chaîne de création à partir du néant.</desc><rect width="1200" height="540" fill="#101719"/><text x="600" y="64" text-anchor="middle" font-family="Georgia,serif" font-size="39" fill="#f0d4a6">Les puissances primordiales</text><text x="600" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d6c7b3">Hésiode, Théogonie, vers 116–122</text><g fill="#202a2b" stroke="#bd9d67" stroke-width="3"><rect x="80" y="153" width="1040" height="104" rx="12"/><rect x="80" y="305" width="310" height="130" rx="12"/><rect x="445" y="305" width="310" height="130" rx="12"/><rect x="810" y="305" width="310" height="130" rx="12"/></g><text x="600" y="199" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f2d7a7">CHAOS — Χάος</text><text x="600" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e4d9c9">Béance ou ouverture primordiale ; sens philologique discuté</text><g text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f2d7a7"><text x="235" y="354">GAÏA</text><text x="600" y="354">TARTARE</text><text x="965" y="354">ÉROS</text></g><g text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e4d9c9"><text x="235" y="394">Assise cosmique</text><text x="600" y="394">Profondeur cosmique</text><text x="965" y="394">Puissance d’union</text></g><text x="600" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d4c5b0">Disposition de lecture, non arbre généalogique ni création ex nihilo</text><text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b8ae9e">MYTHOS · schéma vectoriel original, 2026 · illustration contemporaine non historique</text></svg>