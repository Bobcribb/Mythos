<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Les Muses et l’autorité du poète</title><desc id="desc">Théogonie 1–35 · vérité, apparence et inspiration — Apparence : Les Muses savent dire : des récits faux ayant : l’aspect de vérités ; Vérité : Elles déclarent aussi : pouvoir énoncer : la vérité à leur gré ; Enjeu : Le savoir poétique : dépend d’une parole : divine ambivalente. L’invocation n’efface pas le problème de la crédibilité du discours.</desc><rect width="1200" height="545" fill="#101719"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#efd4a2">Les Muses et l’autorité du poète</text><text x="600" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d2c6b7">Théogonie 1–35 · vérité, apparence et inspiration</text><rect x="45" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="218" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Apparence</text><text x="218" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Les Muses savent dire</text><text x="218" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">des récits faux ayant</text><text x="218" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">l’aspect de vérités</text><rect x="430" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="603" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Vérité</text><text x="603" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Elles déclarent aussi</text><text x="603" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">pouvoir énoncer</text><text x="603" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">la vérité à leur gré</text><rect x="815" y="148" width="345" height="255" rx="12" fill="#202a2b" stroke="#ba965f" stroke-width="2.5"/><text x="988" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#edd09a">Enjeu</text><text x="988" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">Le savoir poétique</text><text x="988" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">dépend d’une parole</text><text x="988" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#e2d7c6">divine ambivalente</text><text x="600" y="465" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f1dfc1">L’invocation n’efface pas le problème de la crédibilité du discours.</text><text x="600" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bdb2a2">Hésiode, Théogonie 22–35, notamment 26–28.</text><text x="600" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a79e92">MYTHOS · 2026 · création vectorielle pédagogique assistée par IA · non historique</text></svg>