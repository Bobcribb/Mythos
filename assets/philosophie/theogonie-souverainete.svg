<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Succession des souverainetés divines dans la Théogonie</title><desc id="desc">Trois étapes interprétatives : Ouranos empêche l'émergence de ses enfants ; Cronos dévore les siens ; Zeus stabilise l'ordre divin par la victoire et la répartition des honneurs.</desc><rect width="1200" height="600" fill="#101719"/><text x="600" y="62" text-anchor="middle" font-size="39" font-family="Georgia,serif" fill="#f1d6a7">La souveraineté dans la Théogonie</text><text x="600" y="100" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#cfc4b3">Une succession de pouvoirs — lecture philosophique</text><g fill="#202a2b" stroke="#bfa06a" stroke-width="3"><rect x="55" y="160" width="320" height="270" rx="12"/><rect x="440" y="160" width="320" height="270" rx="12"/><rect x="825" y="160" width="320" height="270" rx="12"/></g><g font-family="Georgia,serif" font-size="33" fill="#f2d7a6" text-anchor="middle"><text x="215" y="223">OURANOS</text><text x="600" y="223">CRONOS</text><text x="985" y="223">ZEUS</text></g><g font-family="Arial,sans-serif" font-size="20" fill="#e9e0d2" text-anchor="middle"><text x="215" y="280">Empêche l’émergence</text><text x="215" y="313">de sa descendance</text><text x="600" y="280">Dévore ses enfants</text><text x="600" y="313">pour éviter sa chute</text><text x="985" y="280">Vainc ses adversaires</text><text x="985" y="313">et répartit les honneurs</text></g><g fill="#d4b47e"><path d="M390 295l34 0-12-12m12 12-12 12" stroke="#d4b47e" stroke-width="5" fill="none"/><path d="M775 295l34 0-12-12m12 12-12 12" stroke="#d4b47e" stroke-width="5" fill="none"/></g><text x="600" y="490" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f0dec1">De la domination qui bloque à l’ordre qui distribue</text><text x="600" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#cfc3b2">La stabilité de Zeus reste fondée sur des conflits : ce schéma ne signifie pas la fin de la violence.</text><text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#b7ae9f">MYTHOS · schéma original contemporain, 2026 · Hésiode, Théogonie, env. v. 154–210, 453–506, 617–885</text></svg>