<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="t d"><title id="t">Patrocle et Achille : de l'amitié au deuil et à la vengeance</title><desc id="d">Schéma analytique du lien entre le prêt des armes, la mort de Patrocle, la culpabilité d'Achille et son retour au combat.</desc><rect width="1200" height="530" fill="#101719"/><text x="600" y="64" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#f0d4a6">Patrocle : l’amitié et la responsabilité</text><text x="600" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d5c6b2">Iliade XVI–XVIII · une chaîne tragique, non une causalité unique</text><g fill="#202a2b" stroke="#bd9d67" stroke-width="3"><rect x="35" y="165" width="260" height="205" rx="12"/><rect x="325" y="165" width="260" height="205" rx="12"/><rect x="615" y="165" width="260" height="205" rx="12"/><rect x="905" y="165" width="260" height="205" rx="12"/></g><g font-family="Georgia,serif" font-size="25" fill="#f0d4a6" text-anchor="middle"><text x="165" y="222">SUBSTITUTION</text><text x="455" y="222">PERTE</text><text x="745" y="222">DEUIL</text><text x="1035" y="222">RETOUR</text></g><g font-family="Arial,sans-serif" font-size="19" fill="#e9dfd0" text-anchor="middle"><text x="165" y="272">Patrocle porte</text><text x="165" y="301">les armes d’Achille</text><text x="455" y="272">Mort de Patrocle</text><text x="455" y="301">au combat</text><text x="745" y="272">Souffrance et</text><text x="745" y="301">culpabilité d’Achille</text><text x="1035" y="272">Combat, vengeance</text><text x="1035" y="301">et mortalité</text></g><g stroke="#d3b47c" stroke-width="4" fill="none"><path d="M297 267h25l-10-10m10 10-10 10"/><path d="M587 267h25l-10-10m10 10-10 10"/><path d="M877 267h25l-10-10m10 10-10 10"/></g><text x="600" y="435" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#efddc0">La solidarité peut conduire au sacrifice ; la douleur, à la violence</text><text x="600" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#bfb3a4">MYTHOS · schéma interprétatif original, 2026 · non historique · Iliade XVI–XVIII</text></svg>