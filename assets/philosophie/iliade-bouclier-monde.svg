<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="titre description">
<title id="titre">Le bouclier d’Achille : un monde à préserver</title><desc id="description">Schéma conceptuel, non restitution archéologique : cosmos, deux cités en paix ou en guerre, travaux agricoles et danses ; l’Océan borde le bouclier.</desc>
<rect width="1200" height="650" fill="#0d1518"/>
<rect x="16" y="17" width="1168" height="616" rx="20" fill="none" stroke="#594932" stroke-width="2"/>
<text x="600" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#e9c98f">Le bouclier d’Achille : un monde à préserver</text>
<text x="600" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d4c4ab">L’Iliade, chant XVIII, vers 478–608 — ekphrasis d’Héphaïstos</text>
<rect x="33" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="47" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="205" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LE COSMOS</text><text x="205" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Terre, ciel et mer</text><text x="205" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Soleil, lune et étoiles</text><text x="205" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Un horizon commun</text><rect x="429" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="443" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="601" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LES DEUX CITÉS</text><text x="601" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Noces et tribunal</text><text x="601" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Siège et bataille</text><text x="601" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Justice et conflit</text><rect x="825" y="183" width="344" height="242" rx="14" fill="#1d2729" stroke="#bda16d" stroke-width="2.5"/><rect x="839" y="199" width="316" height="5" rx="2" fill="#bc9c63"/><text x="997" y="250" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#f3d7a9">LES VIES ORDINAIRES</text><text x="997" y="315" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Labours et moissons</text><text x="997" y="359" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Vignes, troupeaux, danse</text><text x="997" y="403" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#efe5d7">Le travail et la fête</text>
<text x="600" y="508" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#e9cfac">Océan marque le pourtour ; le texte ne localise pas toutes les autres scènes.</text>
